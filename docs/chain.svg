<svg viewBox="0 0 940 220" xmlns="http://www.w3.org/2000/svg">

  <style>
    /* colors (resolved from CSS variables) */
    .wire { fill:none; stroke:#2F3D49; stroke-width:1.5; }
    .node-box { fill:#161E26; stroke:#2F3D49; stroke-width:1.5; }

    .node-label { font-family:monospace; font-size:12px; fill:#E9EEF1; }
    .bus-label { font-family:monospace; font-size:10px; fill:#5C6A75; }
    .port-label { font-family:monospace; font-size:9.5px; fill:#97A4AF; }

    .port { stroke:#0B0E12; stroke-width:1.5; }
    .port-pos { fill:#FFB000; }
    .port-bit { fill:#5FD6CC; }

    /* scope-trace persistence: dim base + bright wipe sharing the same path */
    .trace-base { fill:none; stroke-width:2; }
    .trace-base-analog { stroke:#FFB000; opacity:.16; }
    .trace-base-digital { stroke:#5FD6CC; opacity:.16; }

    .trace-wipe { fill:none; stroke-width:2; opacity:.95; }
    .trace-wipe-analog { stroke:#FFB000; }
    .trace-wipe-digital { stroke:#5FD6CC; }

    /* analog wipe: path length ~249. Draw on left-to-right, hold, erase left-to-right, hold, repeat over 4s */
    @keyframes wipe-pos {
      0%        { stroke-dashoffset: 249; }
      8%        { stroke-dashoffset: 249; }
      34%       { stroke-dashoffset: 0; }
      42%       { stroke-dashoffset: 0; }
      46%       { stroke-dashoffset: -249; }
      100%      { stroke-dashoffset: -249; }
    }

    /* digital wipe: path length ~411. Active window 46%-96% of the same 4s loop */
    @keyframes wipe-bit {
      0%        { stroke-dashoffset: 411; }
      46%       { stroke-dashoffset: 411; }
      80%       { stroke-dashoffset: 0; }
      88%       { stroke-dashoffset: 0; }
      92%       { stroke-dashoffset: -411; }
      100%      { stroke-dashoffset: -411; }
    }

    .wipe-pos {
      stroke-dasharray: 249 249;
      animation: wipe-pos 4s linear infinite;
    }
    .wipe-bit {
      stroke-dasharray: 411 411;
      animation: wipe-bit 4s linear infinite;
    }

    @keyframes led-blink {
      0%,100% { opacity:.3; }
      50% { opacity:1; }
    }

    .led { fill:#FFB000; animation:led-blink 1.6s ease-in-out infinite; }

    /* data-arrow flash: fires once the digital trace finishes drawing (~88% of loop) */
    @keyframes data-flash {
      0%   { opacity:.55; stroke:#2F3D49; filter:none; }
      88%  { opacity:.55; stroke:#2F3D49; filter:none; }
      90%  { opacity:1; stroke:#3DFF6E; filter:drop-shadow(0 0 4px #3DFF6E); }
      94%  { opacity:1; stroke:#3DFF6E; filter:drop-shadow(0 0 4px #3DFF6E); }
      99%  { opacity:.55; stroke:#2F3D49; filter:none; }
      100% { opacity:.55; stroke:#2F3D49; filter:none; }
    }

    .data-arrow { animation:data-flash 4s linear infinite; }
  </style>

  <!-- labels -->
  <text class="bus-label" x="277" y="68" text-anchor="middle">pos_bus</text>
  <text class="bus-label" x="642" y="68" text-anchor="middle">bit_bus</text>

  <!-- analog path: dim persistence base + bright sweeping wipe -->
  <path class="trace-base trace-base-analog"
        d="M160,110 C190,86 220,134 250,110 C280,86 310,134 340,110 C362,96 382,124 395,110"/>
  <path class="trace-wipe trace-wipe-analog wipe-pos"
        d="M160,110 C190,86 220,134 250,110 C280,86 310,134 340,110 C362,96 382,124 395,110"/>

  <!-- digital path: dim persistence base + bright sweeping wipe -->
  <path class="trace-base trace-base-digital"
        d="M525,110 H560 V88 H600 V132 H640 V88 H680 V132 H720 V110 H760"/>
  <path class="trace-wipe trace-wipe-digital wipe-bit"
        d="M525,110 H560 V88 H600 V132 H640 V88 H680 V132 H720 V110 H760"/>

  <!-- output -->
  <path class="wire data-arrow" d="M890,110 H922"/>
  <path class="wire data-arrow" d="M916,104 L924,110 L916,116"/>
  <text class="bus-label" x="905" y="98" text-anchor="middle">data</text>

  <!-- INENC -->
  <g>
    <rect class="node-box" x="30" y="74" width="130" height="72" rx="9"/>
    <text class="node-label" x="95" y="100" text-anchor="middle">INENC</text>
    <text class="port-label" x="146" y="115" text-anchor="end">val</text>
    <text class="bus-label" x="95" y="134" text-anchor="middle">encoder in</text>
    <circle class="port port-pos" cx="160" cy="110" r="4.5"/>
  </g>

  <!-- PCOMP -->
  <g>
    <rect class="node-box" x="395" y="74" width="130" height="72" rx="9"/>
    <text class="node-label" x="460" y="100" text-anchor="middle">PCOMP</text>
    <text class="port-label" x="402" y="115" text-anchor="start">inp</text>
    <text class="port-label" x="518" y="115" text-anchor="end">out</text>
    <text class="bus-label" x="460" y="134" text-anchor="middle">position compare</text>
    <circle class="port port-pos" cx="395" cy="110" r="4.5"/>
    <circle class="port port-bit" cx="525" cy="110" r="4.5"/>
  </g>

  <!-- PCAP -->
  <g>
    <rect class="node-box" x="760" y="74" width="130" height="72" rx="9"/>
    <text class="node-label" x="825" y="100" text-anchor="middle">PCAP</text>
    <text class="port-label" x="767" y="115" text-anchor="start">trig</text>
    <text class="bus-label" x="825" y="134" text-anchor="middle">position capture</text>
    <circle class="port port-bit" cx="760" cy="110" r="4.5"/>
    <circle class="led" cx="876" cy="88" r="3.5"/>
  </g>

</svg>
